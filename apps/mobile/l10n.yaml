# Flutter gen-l10n. The ARB files are generated from packages/i18n (the only string source) — edit
# packages/i18n/messages.*.json, then run `npm run build:arb -w @doktool/i18n`.
arb-dir: lib/src/l10n/arb
template-arb-file: app_fr.arb
output-dir: lib/src/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
