name: doktool
description: "DokTool — clinical utility for doctors, residents and medical students (iOS + Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  file_picker: ^13.1.0
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.20
  pdfrx: ^2.6.5
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  swagger_parser: ^1.45.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
  # gen-l10n: ARB files are generated from packages/i18n (npm run build:arb -w @doktool/i18n).
  generate: true
  # Fonts converted from design/system/fonts (Lock L19); licence: assets/fonts/README.md.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
